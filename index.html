<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESCAPE_TUNNELS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game">

        <!-- 
        
        This is the timer and the amount of time on the timer. 
        You can change the timer duration here.

        -->

        <div class="timer" id="timer">10:00</div>


        <!-- 
        
        This is the 1st 'page' 
        
        -->
        <section class="game-page active" id="page-1">
            <h1>Tunnel 1</h1>

            <div class="buttons">
                <button class="correct-button">Correct answer</button>
                <button class="incorrect-button">Incorrect answer</button>
            </div>
        </section>


        <!-- 
        
        This is the 2nd 'page' 
        
        -->
        <section class="game-page" id="page-2">
            <h1>Tunnel 2</h1>

            <div class="buttons">
                <button class="correct-button">Correct answer</button>
                <button class="incorrect-button">Incorrect answer</button>
            </div>
        </section>


        <!-- 
        
        This is the 3rd 'page' 
        
        -->
        <section class="game-page" id="page-3">
            <h1>Page 3</h1>

            <div class="buttons">
                <button class="correct-button">Correct answer</button>
                <button class="incorrect-button">Incorrect answer</button>
            </div>
        </section>


        <!-- 
        
        This is the 4th 'page' 
        
        -->
        <section class="game-page" id="page-4">
            <h1>Tunnel 4</h1>

            <div class="buttons">
                <button class="correct-button">Correct answer</button>
                <button class="incorrect-button">Incorrect answer</button>
            </div>
        </section>


        <!-- 
        
        This is the 5th 'page' 
        
        -->
        <section class="game-page" id="page-5">
            <h1>Tunnel 5</h1>

            <div class="buttons">
                <button class="correct-button">Correct answer</button>
                <button class="incorrect-button">Incorrect answer</button>
            </div>
        </section>


        <!-- 

        This is the page that you see when you have 'won'. 
        
        -->
        <section class="game-page" id="win-page">
            <h1>You won!</h1>

            <button id="win-play-again">Play again</button>
        </section>


        <!-- 

        This is the page that you see when you have 'lost'. 
        
        -->
        <section class="game-page" id="lose-page">
            <h1>You lost.</h1>

            <button id="lose-play-again">Play again</button>
        </section>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
